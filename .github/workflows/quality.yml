name: CALLE360 personal quality checks
on:
  push:
    branches:
      - development/**
  pull_request:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static and functional smoke tests
        run: node --test tests/personal-smoke.test.mjs
